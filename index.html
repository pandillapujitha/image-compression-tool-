
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.wrap {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-top: 20px;
}

.box {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.panel {
  flex: 1;
}

img {
  width: 100%;
  border-radius: 10px;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
  background: #3b82f6;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

input[type="range"] {
  width: 80%;
}
</style>

</head>

<body>

<div class="wrap">

  <h1>Image Compressor Pro 🚀</h1>

  <input type="file" id="fileInput">

  <div>
    <input type="range" id="quality" min="10" max="100" value="80">
    <p>JPEG Quality: <span id="qVal">80</span>%</p>
  </div>

  <button onclick="compressImage()">Compress</button>

  <div class="box">
    <div class="panel">
      <h3>Before</h3>
      <img id="beforeImg">
      <p id="beforeSize"></p>
    </div>

    <div class="panel">
      <h3>After</h3>
      <img id="afterImg">
      <p id="afterSize"></p>

      <a id="downloadBtn" style="display:none;">
        <button style="background:green;">Download</button>
      </a>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

</div>

<script>
let file;

// file select
document.getElementById("fileInput").addEventListener("change", function(e){
  file = e.target.files[0];

  if(file){
    document.getElementById("beforeImg").src = URL.createObjectURL(file);
    document.getElementById("beforeSize").innerText =
      "Size: " + (file.size/1024).toFixed(2) + " KB";
  }
});

// quality slider
document.getElementById("quality").addEventListener("input", function(){
  document.getElementById("qVal").innerText = this.value;
});

// compress function
function compressImage(){
  if(!file){
    alert("Select image first!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();

    img.onload = function(){
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      let quality = document.getElementById("quality").value / 100;

      let compressed = canvas.toDataURL("image/jpeg", quality);

      // show after image
      let afterImg = document.getElementById("afterImg");
      afterImg.src = compressed;

      // calculate size
      let size = Math.round((compressed.length * 3) / 4);
      document.getElementById("afterSize").innerText =
        "Size: " + (size/1024).toFixed(2) + " KB";

      // download setup
      let downloadBtn = document.getElementById("downloadBtn");
      downloadBtn.href = compressed;
      downloadBtn.download = "compressed.jpg";
      downloadBtn.style.display = "inline";
    }

    img.src = e.target.result;
  }

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
