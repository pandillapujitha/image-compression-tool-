
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compression Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color: white;
  display: flex;
  justify-content: center;
}

.container {
  width: 95%;
  max-width: 400px;
  margin-top: 20px;
}

.glass {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

h1 {
  text-align: center;
}

.upload-box {
  border: 2px dashed white;
  padding: 30px;
  text-align: center;
  border-radius: 15px;
  cursor: pointer;
}

.upload-box:hover {
  background: rgba(255,255,255,0.1);
}

.upload-icon {
  font-size: 50px;
}

img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.slider {
  width: 100%;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  margin-top: 10px;
  background: #00c6ff;
  color: white;
  font-size: 16px;
}

.info {
  font-size: 14px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="glass">
    <h1>📸 Image Compression Pro</h1>

    <div class="upload-box" id="drop">
      <div class="upload-icon">⬆️</div>
      <p>Tap or Drag Image</p>
      <input type="file" id="fileInput" hidden>
    </div>

    <img id="preview">

    <input type="range" min="0.1" max="1" step="0.1" value="0.8" class="slider" id="quality">

    <div class="info" id="info"></div>

    <button onclick="download()">⬇️ Download</button>
    <button onclick="removeBg()">✨ Remove Background</button>

  </div>
</div>

<script>
let originalFile, compressedBlob;

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const quality = document.getElementById("quality");
const info = document.getElementById("info");
const drop = document.getElementById("drop");

// CLICK
drop.onclick = () => fileInput.click();

// DRAG
drop.ondragover = e => {
  e.preventDefault();
};
drop.ondrop = e => {
  e.preventDefault();
  loadFile(e.dataTransfer.files[0]);
};

fileInput.onchange = e => {
  loadFile(e.target.files[0]);
};

function loadFile(file) {
  originalFile = file;

  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    compress();
  };
  reader.readAsDataURL(file);
}

// AUTO COMPRESS ON SLIDE
quality.oninput = compress;

function compress() {
  if (!originalFile) return;

  const img = new Image();
  img.src = preview.src;

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    canvas.toBlob(blob => {
      compressedBlob = blob;

      const originalSize = originalFile.size / 1024;
      const newSize = blob.size / 1024;
      const saved = ((originalSize - newSize) / originalSize * 100).toFixed(1);

      info.innerHTML = `
        Original: ${originalSize.toFixed(1)} KB <br>
        Compressed: ${newSize.toFixed(1)} KB <br>
        Saved: ${saved}%
      `;
    }, "image/jpeg", quality.value);
  };
}

function download() {
  if (!compressedBlob) return;

  const link = document.createElement("a");
  link.href = URL.createObjectURL(compressedBlob);
  link.download = "compressed.jpg";
  link.click();
}

// SIMPLE BG REMOVE (basic white removal)
function removeBg() {
  if (!originalFile) return;

  const img = new Image();
  img.src = preview.src;

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const data = imageData.data;

    for(let i=0;i<data.length;i+=4){
      if(data[i]>200 && data[i+1]>200 && data[i+2]>200){
        data[i+3] = 0;
      }
    }

    ctx.putImageData(imageData,0,0);

    preview.src = canvas.toDataURL("image/png");
  };
}
</script>

</body>
</html>
