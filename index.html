
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Compressor Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

/* glowing bg */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}
.blob {
  position: absolute;
  width: 300px;
  height: 300px;
  filter: blur(120px);
  opacity: 0.4;
  border-radius: 50%;
  animation: move 10s infinite alternate;
}
.blob:nth-child(1){ background:#3b82f6; left:10%; top:20%;}
.blob:nth-child(2){ background:#a855f7; left:60%; top:10%;}
.blob:nth-child(3){ background:#22c55e; left:30%; top:60%;}
@keyframes move { to { transform: translateY(80px);} }

.wrap {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
}

.upload-box {
  border: 2px dashed rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 20px;
  transition: 0.3s;
}
.upload-box.dragover {
  border-color: #06b6d4;
  background: rgba(6,182,212,0.1);
}

.custom-file {
  padding: 10px 20px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
}

input, select {
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin: 5px;
}

input[type="range"] {
  width: 80%;
}

button {
  margin-top: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  color: white;
  background: linear-gradient(135deg, #4f46e5, #06b6d4);
  cursor: pointer;
}

.box {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.panel {
  flex: 1;
  padding: 15px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.06);
}

img {
  width: 100%;
  border-radius: 10px;
}

.download {
  background: green;
}
</style>
</head>

<body>

<div class="bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="wrap">
<h1>🚀 Image Compressor Pro</h1>

<div class="upload-box" id="dropArea">
  <p>📂 Drag & Drop Image Here</p>
  <p>or</p>
  <label class="custom-file">
    Choose Image
    <input type="file" id="fileInput" accept="image/*" hidden>
  </label>
</div>

<p>Quality: <span id="qVal">100</span>%</p>
<input type="range" id="quality" min="10" max="100" value="100">

<p>Format:</p>
<select id="format">
  <option value="image/jpeg">JPEG</option>
  <option value="image/png">PNG</option>
  <option value="image/webp">WEBP</option>
</select>

<p>Resize Width (px):</p>
<input type="number" id="resize" placeholder="Original size">

<br>
<button onclick="compress()">Compress</button>

<div class="box" id="result" style="display:none;">
  <div class="panel">
    <h3>Before</h3>
    <img id="beforeImg">
    <p id="beforeSize"></p>
  </div>

  <div class="panel">
    <h3>After</h3>
    <img id="afterImg">
    <p id="afterSize"></p>
    <a id="downloadBtn" download="compressed.jpg">
      <button class="download">Download</button>
    </a>
  </div>
</div>

</div>

<script>
let file = null;

// preview
function showPreview(file){
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById("beforeImg").src = e.target.result;
    document.getElementById("beforeSize").innerText =
      "Size: " + (file.size/1024).toFixed(2) + " KB";

    document.getElementById("result").style.display = "flex";

    document.getElementById("afterImg").src = "";
    document.getElementById("afterSize").innerText = "";
  };
  reader.readAsDataURL(file);
}

// file select
document.getElementById("fileInput").addEventListener("change", function(e){
  file = e.target.files[0];
  showPreview(file);
});

// drag drop
const dropArea = document.getElementById("dropArea");

dropArea.addEventListener("dragover", e=>{
  e.preventDefault();
  dropArea.classList.add("dragover");
});

dropArea.addEventListener("dragleave", ()=>{
  dropArea.classList.remove("dragover");
});

dropArea.addEventListener("drop", e=>{
  e.preventDefault();
  dropArea.classList.remove("dragover");

  const droppedFile = e.dataTransfer.files[0];

  if(droppedFile && droppedFile.type.startsWith("image/")){
    file = droppedFile;
    showPreview(file);
  } else {
    alert("Drop image only");
  }
});

// slider
document.getElementById("quality").addEventListener("input", e=>{
  document.getElementById("qVal").innerText = e.target.value;
});

// compress
function compress(){
  if(!file){
    alert("Select image first");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();

    img.onload = function(){
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      let width = img.width;
      let height = img.height;

      let resizeVal = document.getElementById("resize").value;

      if(resizeVal && resizeVal < width){
        height = height * (resizeVal / width);
        width = resizeVal;
      }

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img,0,0,width,height);

      const quality = document.getElementById("quality").value / 100;
      const format = document.getElementById("format").value;

      const compressed = canvas.toDataURL(format, quality);

      document.getElementById("afterImg").src = compressed;

      const size = Math.round((compressed.length*3)/4)/1024;

      document.getElementById("afterSize").innerText =
        "Size: " + size.toFixed(2) + " KB";

      document.getElementById("downloadBtn").href = compressed;
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}
</script>

</body>
  </html>
