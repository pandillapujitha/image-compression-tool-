
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Tool Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#1e3c72,#2a5298);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Glass Card */
.container {
  width: 360px;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  color: white;
  text-align: center;
}

/* Drop Area */
.drop-area {
  border: 2px dashed rgba(255,255,255,0.6);
  padding: 25px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.drop-area:hover {
  background: rgba(255,255,255,0.2);
}

/* Upload Icon */
.upload-icon {
  animation: bounce 1.5s infinite;
  margin-bottom: 10px;
}

.upload-icon svg {
  filter: drop-shadow(0 0 10px #00c6ff);
}

/* Bounce Animation */
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.preview-img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}

/* Slider */
input[type=range] {
  width: 100%;
}

/* Buttons */
button {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #00c6ff;
  color: white;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #0072ff;
}

/* Compare */
.compare {
  position: relative;
  width: 100%;
  margin-top: 10px;
}

.compare img {
  width: 100%;
  border-radius: 10px;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
}

.overlay img {
  width: 100%;
}
</style>
</head>

<body>

<div class="container">
  <h2>Image Tool Pro</h2>

  <div class="drop-area" id="dropArea">
    
    <div class="upload-icon">
      <svg width="50" height="50" fill="white" viewBox="0 0 24 24">
        <path d="M12 2L6 8h4v6h4V8h4z"/>
        <path d="M4 18h16v2H4z"/>
      </svg>
    </div>

    <p>Drop Image or Click to Upload</p>

    <img id="preview" class="preview-img" style="display:none;">
    <input type="file" id="upload" hidden>

  </div>

  <p>Compression: <span id="qualityValue">80</span>%</p>
  <input type="range" id="quality" min="10" max="100" value="80">

  <p id="sizeInfo"></p>

  <!-- Compare -->
  <div class="compare" id="compareBox" style="display:none;">
    <img id="afterImg">
    <div class="overlay" id="overlay">
      <img id="beforeImg">
    </div>
    <input type="range" id="slider" min="0" max="100" value="50">
  </div>

  <button onclick="downloadImage()">Download</button>
</div>

<script>
let originalFile;
let compressedBlob;

const upload = document.getElementById("upload");
const preview = document.getElementById("preview");
const qualitySlider = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");
const sizeInfo = document.getElementById("sizeInfo");
const dropArea = document.getElementById("dropArea");

// Click upload
dropArea.onclick = () => upload.click();

// Drag & Drop
dropArea.addEventListener("dragover", e => e.preventDefault());

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  handleFile(e.dataTransfer.files[0]);
});

// File select
upload.onchange = e => {
  handleFile(e.target.files[0]);
};

function handleFile(file) {
  if (!file) return;
  originalFile = file;

  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    preview.style.display = "block";
    compressImage();
  };
  reader.readAsDataURL(file);
}

// Slider auto compress
qualitySlider.oninput = () => {
  qualityValue.innerText = qualitySlider.value;
  compressImage();
};

// Compression
function compressImage() {
  if (!originalFile) return;

  const img = new Image();
  img.src = URL.createObjectURL(originalFile);

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    canvas.toBlob(blob => {
      compressedBlob = blob;

      const beforeSize = (originalFile.size/1024).toFixed(1);
      const afterSize = (blob.size/1024).toFixed(1);
      const saved = ((1 - blob.size/originalFile.size)*100).toFixed(1);

      sizeInfo.innerText =
        `Before: ${beforeSize}KB | After: ${afterSize}KB | Saved: ${saved}%`;

      // Compare
      document.getElementById("compareBox").style.display = "block";
      document.getElementById("beforeImg").src = URL.createObjectURL(originalFile);
      document.getElementById("afterImg").src = URL.createObjectURL(blob);

    }, "image/jpeg", qualitySlider.value/100);
  };
}

// Compare slider
const slider = document.getElementById("slider");
const overlay = document.getElementById("overlay");

slider.oninput = () => {
  overlay.style.width = slider.value + "%";
};

// Download
function downloadImage() {
  if (!compressedBlob) return;

  const link = document.createElement("a");
  link.href = URL.createObjectURL(compressedBlob);
  link.download = "compressed.jpg";
  link.click();
}
</script>

</body>
  </html>
