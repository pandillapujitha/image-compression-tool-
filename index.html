
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compression Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color: white;
  text-align: center;
}

/* Glass Container */
.container {
  max-width: 420px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
}

/* Upload Box */
.upload {
  border: 2px dashed white;
  padding: 25px;
  border-radius: 15px;
  cursor: pointer;
}

.upload:hover {
  background: rgba(255,255,255,0.1);
}

.upload-icon {
  font-size: 30px;
}

/* Image Slider */
.compare {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 10px;
}

.compare img {
  width: 100%;
  display: block;
}

.after {
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
}

.slider-bar {
  position: absolute;
  top: 0;
  width: 3px;
  height: 100%;
  background: white;
  cursor: ew-resize;
}

/* Controls */
input[type=range] {
  width: 100%;
}

button {
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.download {
  background: #00c853;
  color: white;
}

</style>
</head>

<body>

<div class="container">

<h2>🖼️ Image Compression Pro</h2>

<div class="upload" id="dropArea">
  <div class="upload-icon">📂</div>
  Tap or Drag Image
  <input type="file" id="fileInput" hidden>
</div>

<br>

<div class="compare" id="compareBox" style="display:none;">
  <img id="beforeImg">
  <div class="after" id="afterBox">
    <img id="afterImg">
  </div>
  <div class="slider-bar" id="slider"></div>
</div>

<p id="beforeSize"></p>
<p id="afterSize"></p>
<p id="saved"></p>

<input type="range" min="10" max="100" value="80" id="quality">

<button class="download" onclick="download()">Download</button>

</div>

<script>

let originalFile, compressedBlob;

const fileInput = document.getElementById("fileInput");
const dropArea = document.getElementById("dropArea");

dropArea.onclick = () => fileInput.click();

dropArea.ondragover = e => {
  e.preventDefault();
};

dropArea.ondrop = e => {
  e.preventDefault();
  handleFile(e.dataTransfer.files[0]);
};

fileInput.onchange = e => handleFile(e.target.files[0]);

function handleFile(file) {
  if (!file) return;

  originalFile = file;

  document.getElementById("beforeSize").innerText =
    "Before: " + (file.size/1024).toFixed(2) + " KB";

  const reader = new FileReader();
  reader.onload = () => {
    beforeImg.src = reader.result;
    document.getElementById("compareBox").style.display = "block";
    compress();
  };
  reader.readAsDataURL(file);
}

/* Compression */
quality.oninput = compress;

function compress() {
  if (!originalFile) return;

  const img = new Image();
  img.src = URL.createObjectURL(originalFile);

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img,0,0);

    let q = quality.value / 100;

    canvas.toBlob(blob => {
      compressedBlob = blob;

      afterImg.src = URL.createObjectURL(blob);

      let after = blob.size;

      document.getElementById("afterSize").innerText =
        "After: " + (after/1024).toFixed(2) + " KB";

      let percent = 100 - ((after / originalFile.size) * 100);

      document.getElementById("saved").innerText =
        "Saved: " + percent.toFixed(1) + "%";

    }, "image/jpeg", q);
  };
}

/* Download */
function download() {
  if (!compressedBlob) return;

  const a = document.createElement("a");
  a.href = URL.createObjectURL(compressedBlob);
  a.download = "compressed.jpg";
  a.click();
}

/* Before After Slider */
const slider = document.getElementById("slider");
const afterBox = document.getElementById("afterBox");

let isDown = false;

slider.onmousedown = () => isDown = true;
window.onmouseup = () => isDown = false;

window.onmousemove = e => {
  if (!isDown) return;

  const rect = document.getElementById("compareBox").getBoundingClientRect();
  let x = e.clientX - rect.left;

  afterBox.style.width = x + "px";
  slider.style.left = x + "px";
};

</script>

</body>
  </html>
