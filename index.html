
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* glowing background */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.blob {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.4;
  animation: move 8s infinite alternate;
}

.blob:nth-child(1){ background:#3b82f6; top:10%; left:20%; }
.blob:nth-child(2){ background:#a855f7; top:30%; left:60%; }
.blob:nth-child(3){ background:#22c55e; top:70%; left:30%; }

@keyframes move {
  from { transform: translateY(0px); }
  to { transform: translateY(80px); }
}

/* glass container */
.wrap {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

.box {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.panel {
  flex: 1;
  padding: 10px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
}

img {
  width: 100%;
  border-radius: 10px;
}

/* buttons */
button {
  padding: 10px 20px;
  margin-top: 10px;
  background: rgba(59,130,246,0.7);
  border: none;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: rgba(59,130,246,1);
}

input[type="range"] {
  width: 80%;
}

/* progress bar */
.progress-container {
  width: 80%;
  height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin: 15px auto;
  overflow: hidden;
  display: none;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
  transition: width 0.3s;
}
</style>
</head>

<body>

<!-- background -->
<div class="bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="wrap">

  <h1>Image Compressor Pro 🚀</h1>

  <input type="file" id="fileInput">

  <div>
    <input type="range" id="quality" min="10" max="100" value="80">
    <p>JPEG Quality: <span id="qVal">80</span>%</p>
  </div>

  <button onclick="compressImage()">Compress</button>

  <!-- progress bar -->
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="box">
    <div class="panel">
      <h3>Before</h3>
      <img id="beforeImg">
      <p id="beforeSize"></p>
    </div>

    <div class="panel">
      <h3>After</h3>
      <img id="afterImg">
      <p id="afterSize"></p>

      <a id="downloadBtn" style="display:none;">
        <button style="background:green;">Download</button>
      </a>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

</div>

<script>
let file;

// file select
document.getElementById("fileInput").addEventListener("change", function(e){
  file = e.target.files[0];

  if(file){
    document.getElementById("beforeImg").src = URL.createObjectURL(file);
    document.getElementById("beforeSize").innerText =
      "Size: " + (file.size/1024).toFixed(2) + " KB";
  }
});

// slider
document.getElementById("quality").addEventListener("input", function(){
  document.getElementById("qVal").innerText = this.value;
});

// fake progress animation
function simulateProgress(callback){
  let bar = document.getElementById("progressBar");
  let container = document.getElementById("progressContainer");

  container.style.display = "block";
  bar.style.width = "0%";

  let progress = 0;

  let interval = setInterval(() => {
    progress += 10;
    bar.style.width = progress + "%";

    if(progress >= 100){
      clearInterval(interval);
      setTimeout(() => {
        container.style.display = "none";
        callback();
      }, 300);
    }
  }, 100);
}

// compress
function compressImage(){
  if(!file){
    alert("Select image first!");
    return;
  }

  simulateProgress(() => {

    const reader = new FileReader();

    reader.onload = function(e){
      const img = new Image();

      img.onload = function(){
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        let quality = document.getElementById("quality").value / 100;

        let compressed = canvas.toDataURL("image/jpeg", quality);

        document.getElementById("afterImg").src = compressed;

        let size = Math.round((compressed.length * 3) / 4);
        document.getElementById("afterSize").innerText =
          "Size: " + (size/1024).toFixed(2) + " KB";

        let downloadBtn = document.getElementById("downloadBtn");
        downloadBtn.href = compressed;
        downloadBtn.download = "compressed.jpg";
        downloadBtn.style.display = "inline";
      }

      img.src = e.target.result;
    }

    reader.readAsDataURL(file);

  });
}
</script>

</body>
</html>
