
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compression Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color: white;
  display: flex;
  justify-content: center;
}

.container {
  width: 95%;
  max-width: 420px;
  margin-top: 20px;
}

.glass {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
}

h2 { text-align: center; }

/* Upload */
.upload {
  border: 2px dashed white;
  padding: 30px;
  text-align: center;
  border-radius: 15px;
  cursor: pointer;
}
.upload-icon { font-size: 50px; }

/* Image */
#canvas {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
  cursor: crosshair;
}

/* Buttons */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.download { background: #00c853; }
.crop { background: #ff9800; }

input[type=range] {
  width: 100%;
}
</style>

</head>

<body>

<div class="container">
<div class="glass">

<h2>🖼️ Image Compression Pro</h2>

<div class="upload" id="drop">
  <div class="upload-icon">⬆️</div>
  Tap or Drag Image
  <input type="file" id="fileInput" hidden>
</div>

<canvas id="canvas"></canvas>

<input type="range" min="0.1" max="1" step="0.1" value="0.8" id="quality">

<p id="info"></p>

<button class="crop" onclick="cropImage()">✂️ Crop</button>
<button class="download" onclick="download()">⬇️ Download</button>

</div>
</div>

<script>

let file, img = new Image();
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let startX, startY, endX, endY, dragging = false;
let compressedBlob;

const fileInput = document.getElementById("fileInput");
const drop = document.getElementById("drop");

drop.onclick = () => fileInput.click();

drop.ondrop = e => {
  e.preventDefault();
  load(e.dataTransfer.files[0]);
};

drop.ondragover = e => e.preventDefault();

fileInput.onchange = e => load(e.target.files[0]);

function load(f) {
  file = f;

  const reader = new FileReader();
  reader.onload = () => {
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

img.onload = () => {
  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img,0,0);
  compress();
};

/* DRAW CROP AREA */
canvas.onmousedown = e => {
  startX = e.offsetX;
  startY = e.offsetY;
  dragging = true;
};

canvas.onmousemove = e => {
  if (!dragging) return;

  endX = e.offsetX;
  endY = e.offsetY;

  ctx.drawImage(img,0,0);

  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.strokeRect(startX,startY,endX-startX,endY-startY);
};

canvas.onmouseup = () => dragging = false;

/* CROP FUNCTION */
function cropImage() {
  let w = endX - startX;
  let h = endY - startY;

  let temp = document.createElement("canvas");
  let tctx = temp.getContext("2d");

  temp.width = w;
  temp.height = h;

  tctx.drawImage(canvas, startX, startY, w, h, 0, 0, w, h);

  img.src = temp.toDataURL();
}

/* COMPRESS */
document.getElementById("quality").oninput = compress;

function compress() {
  canvas.toBlob(blob => {
    compressedBlob = blob;

    let before = file.size/1024;
    let after = blob.size/1024;
    let saved = ((before-after)/before*100).toFixed(1);

    document.getElementById("info").innerHTML =
      `Before: ${before.toFixed(1)} KB<br>
       After: ${after.toFixed(1)} KB<br>
       Saved: ${saved}%`;

  }, "image/jpeg", document.getElementById("quality").value);
}

/* DOWNLOAD */
function download() {
  if (!compressedBlob) return;

  let a = document.createElement("a");
  a.href = URL.createObjectURL(compressedBlob);
  a.download = "compressed.jpg";
  a.click();
}

</script>

</body>
</html>
